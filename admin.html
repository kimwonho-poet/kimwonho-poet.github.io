<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>편집실 | 김원호</title>
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/editor/rich-text.css?v=2">
  <link rel="stylesheet" href="assets/editor/editor.css?v=2">
  <script type="module" src="assets/editor/editor.js?v=2"></script>
</head>
<body>
  <a class="skip" href="#editor-main">본문으로</a>
  <header class="editor-header">
    <a class="wordmark" href="https://kimwonho-poet.github.io/">KIM WONHO <span>/</span> 편집실</a>
    <div class="header-actions">
      <a class="text-link" href="https://kimwonho-poet.github.io/" target="_blank" rel="noopener">홈페이지 보기 <svg aria-hidden="true"><use href="assets/editor/icons.svg#external-link"></use></svg></a>
      <button id="logout" type="button" class="icon-button" title="로그아웃" aria-label="로그아웃" hidden><svg aria-hidden="true"><use href="assets/editor/icons.svg#log-out"></use></svg></button>
    </div>
  </header>
  <main id="editor-main" tabindex="-1">
    <div class="login-view"><p class="eyebrow">EDITOR</p><h1>김원호 편집실</h1><p id="initial-status" role="status">로그인 상태를 확인하고 있습니다.</p></div>
  </main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <noscript>편집실을 사용하려면 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
