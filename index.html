      "title": "화분",
      "body": "가파른 오르막이 있는 동네를 걸었다\n참새 무리 쌀알처럼 모여드는 호야네 정미소를 지나\n기다란 간이 벤치에 쪼르르 모여 앉아\n높이 말아 올린 흰 수건을 머리에 뒤집어쓰고는\n따끔따끔 햇살의 말\n서로 향해 비추어주곤 하던 옆 동네 할머니들\n\n논두렁길 에둘러 멀고 먼 산골 마을\n하나밖에 없곤 했던 샤넬 미용실 현관 앞에는\n잎사귀들 하얗게 센 준쿠스* 머리 할머니\n독하게도 엉킨 파마약 냄새 속으로\n오늘 하루도 차아하암 길다 하고\n다사로운 햇살 넝쿨처럼 휘어들고 있었다\n\n어느새 내 머리도 길게 자라\n곁가지를 쳐주어야 할 때가 되었구나,\n싶어 산 너머 샤넬 미용실\n물때 낀 대거울 앞에 다소곳이 들어앉아\n은빛 전지가위 허리춤에 절그렁거리는\n이미자 이모의 기교 섞인 퍼포먼스에\n무성해진 지난날을 내맡겼다\n\n언제나 짧고 빠르게 칙, 칙, 칙, 칙\n스타카토로 탄주되는 장미빛 분무기와\n모른 새 여우비 피해 이종移種하여\n물비늘 차암 난분분하던 할머니 이름들\n\n금분이, 옆에 기댄 꽃분이\n그 옆에서 까무룩 졸고 계시던\n최연장자 옥분이 할머니의 좁쌀눈을 삥등그리다\n온순하게 가라앉고는 했던 한해살이 화초의 잠\n베어내고 쓸어내지만 새잎으로 피어나던\n\n그때, 열아홉\n쌀뜨물처럼 희뿌연 기억 속 내가\n스포츠형 머리, 거스러진 순정을 이따금 매만지며\n가파른 내리막이 있던 그 동네를 걷는다 텅 빈\n도자기 화분 같은 <임대문의> 상가들을 지나\n높이 태워 올려보는 한 줄기\n공허한 담배 연기\n\n새로 생긴 초등학교 운동장에는\n새로 생긴 아이들이 여럿 모여 축구하고\n불현듯, 내 쪽으로 날아오는 공\n저 공을 어디 한번 기막히게 차줄 테다!\n\n도로변 해당화는\n살아평생 지겹도록 피고 지고\n\n난 여전히 99년식 에쿠스를 몰고 가고\n\n* 준쿠스: 구불구불한 잎의 관상용 식물. 꽃말은 ‘온순’이다.",

                "body": "나는 간다. 빈 유모차를 끌고 아기를 낳으러. 금방 배가 부를까 봐 임부복도 사두었다. 부드러운 순면 기저귀와 입에 꼭 맞는 쪽쪽이 까지. 바퀴가 크지 않아 달달달 손잡이가 흔들리지만, 괜찮아. 돌아올 길은 생각해두지 않았으니까. 어디로든지 간다. 동시에 두 곳을 세 곳을 그 이상을 갈 수도. 그럼 그만큼 많은 젖이 필요하겠지. 번개가 치면 나무가 갈라진다. 나무의 희생 덕분에 내 아기는 무사하다. 나무의 희생 덕분에 길이 두 쪽이 났다. 세 쪽이 났다. 그 이상의 길이 났고 나는 갈림길 앞에 서서 어떤 아기를 먼저 낳을지 고민해야 한다. 아기가 동시에 태어난다면 어쩌지. 셋 다 기를 순 없으니까 가장 강한 아기만 기르는 걸로. 그러면 미래는 무시당한 거니까 성장 가능성도 보는 걸로. 그러면 운명은 무시당한 거니까 점쟁이도 부르는 걸로. 이러니 육아 비용이 무지막지하구나. 빈 유모차가 바퀴를 하나 둘 셋 넷 달고 있다. 바퀴를 한 개 팔면 돌반지 정도는 마련할 수 있을 거야. 너는 육손이로 태어날 거니까 눈에 띄어서는 안 돼. 돌반지는 보석함에 넣어두고. 바퀴는 구른다. 달달달. 아기는 곧 태어날 텐데. 갈림길이 곧 보일 거야. 나는 결정을 미룰 수 없겠지. 아직 입덧은 없지만 큰옷으로 갈아입고 유모차 가림막을 연다. 허공에 쪽쪽이를 물린다. 유모차 빈 좌판에 쪽쪽이가 툭, 떨어진다. 그만큼의 실망은 필요한 법이지. 아기를 기른다는 게 얼마나 힘든 일인데. 부러진 나무에서 새 가지가 돋는다. 소름처럼. 물관과 체관이 끊어지고 구역질이 난다. 입덧처럼. 그것은 나무의 고백. 아기를 기른다는 것이 얼마나 솔직해지는 일인데. 엄마가 된다는 건 부피 없는 비밀 하나 뱃속에 품어보는 일이어서. 아기를 낳으러. 나는. 가야 한다. 뱃속에 아기집을 비워 내러 가야 한다. 그러도록. 꼭 가야 하는데. 예정일이 얼마 남지 않았는데. 나는 어떻게 태어났더라. 그게 기억이 안 나서 갈 길을 잃고,",
                "extent": "full",

                "body": "[출처 F056]\n제41회 계명문학상 시 부문 당선소감 - 아기 엄마(김원호 우석대)\n2021-12-0316:43:04 • 신문방송국\n조회수: 2496\n\n• 제41회 계명문학상 시 부문 당선작 - 아기 엄마\n김원호 (우석대 • 식품생명공학 • 2)\n※ 당선작품은 계명대신문 1185호(2021.11.29.발행)에서 보실 수 있습니다.\n\n• 수상소감\n일 년 전, 보일러가 돌아가는 자취방에서였습니다 방은 후끈한데 밤은 캄캄한 것이 도저히 억울하다는 생각이 들었습니다 나는 왜 이 밤을 새워야 하나요, 수도 없이 물었습니다 빠져나갈 수 없는 공간은 더 깊이 들어가 봄으로써 익숙해지는 법인데, 저의 시작시작詩作始作은 그렇게 이루어졌던 것 같습니다\n어느덧 시를 쓴 지도 일 년이 다 되어 가네요 요즘 들어 다시 보일러를 켜기 시작했습니다 그날과 똑같은 기계음을 내며 똑같은 열기로 제 방은 데워집니다 너희들이 한결같은 덕분에 나는 얼마큼 달라질 수 있었어, 말해주고 싶은 오늘입니다\n내 평생의 난방비를 지출해준 외할머니 엄마 아빠, 나중에 말로 할게, 고마워\n천사에게 말을 배운 정현우 선생님, 시와 제가 항상 맞닿아있다는 것을 느끼게 해주셔서 감사합니다\n우석대 최정숙 교수님, 제게 처음 글쓰기의 재미를 가르쳐주셔서 감사합니다\n문창과 친구들, 시 가르쳐줘서 고마워\n부족한 제 시를 읽어주신 신형철 교수님, 송찬호 시인님, 서영희 교수님께 진심으로 감사드립니다\n마지막으로 속에 있는 이야기를 하렵니다\n나 좀 멋있는 것 같아요 오늘만큼은 안 겸손 할래요 나는 방금 미래를 봤습니다 이거 흑역사로 박제되면 어떡하지\n\n시인이 되겠습니다, 감사합니다!",

                "title": "시 부문 심사평 및 심사위원 소개",
                "body": "[출처 F057 / 소개의 소속은 2021년 원문 기준]\n제41회 계명문학상 시 부문- 심사평(서영희(서영처) 님, 신형철 님,송찬호 님)\n2021-12-03 16:40:35 • 신문방송국\n조회수 : 2234\n\n• 제41회 계명문학상 시 부문 - 심사평(서영희(서영처) 님, 신형철 님, 송찬호 님)\n- 심사위원\n서영희(서영처) 님(계명대 • Tabula Rasa College •교수)\n2003년 \u003c문학/판>으로 등단했다. 시집 \u003c피아노 악어>, \u003c말뚝에 묶인 피아노>를, 산문집 \u003c지금은 클래식을 들을 시간>, \u003c노래의 시대>, \u003c예배당 순례>를 출간했다. 현재 계명대학교 Tabula Rasa College 교수이다.\n\n신형철 님(조선대 • 문예창작학 • 교수 / 문학평론가)\n1976년 출생하여 서울대 국문과 및 동대학원을 졸업했다. 2005년 \u003c문학동네>에 평론을 발표하며 등단했으며, \u003c몰락의 에티카>(2008), \u003c느낌의 공동체>(2011), \u003c정확한 사랑의 실험>(2014), \u003c슬픔을 공부하는 슬픔>(2018)을 출간했다.\n\n송찬호 님(시인)\n1987년 \u003c우리 시대의 문학>으로 등단했다. 시집 \u003c흙은 사각형의 기억을 갖고 있다>, \u003c10년 동안의 빈 의자>, \u003c붉은 눈, 동백>, \u003c고양이가 돌아오는 저녁>, \u003c분홍 나막신>을, 동시집 \u003c저녁별>, \u003c초록 토끼를 만났다>, \u003c여우와 포도>를 출간했다.\n\n• 심사평\n인간은 안팎으로 찍어내는(press) 존재다. 외부가 안으로 찍힐 때 인상(im-pression)이라 하고, 내부가 밖으로 찍힐 때 표현(ex-pression)이라 한다. 회화의 역사에서 인상파(impressionism)와 표현주의(expressionism)라는 유파/사조를 발견할 수 있는 것은 자연스럽다. 문학의 경우는, 적어도 시의 경우는, 더 양보해서 젊은 시인들의 경우는, 확실히 후자의 비중이 높다.\n\n젊은 시인들은 표현하기 위해, 즉 내부에서 들끓는 무언가를 명료하게 만들기 위해 쓴다. 명료하게 만든다는 말은 중요한 말이다. 쉽게 써야 한다는 뜻이 아니라, 정확하게 써야 한다는 뜻이다. 그러려면 자기를 인식하기 위한 투쟁이 먼저이고, 그것에 문장을 부여하는 것은 나중이다. 그래야 시인의 표현 앞에서 독자도 자신의 한 부분이 명료해지는 인식적 충격을 경험하게 된다.\n\n응모작들은 놀랍도록 세련된 문장들을 구사하고 있었지만, 그것이 자기 명료화를 향한 고투의 산물로 보이기보다는, 내 안에 무언가 의미심장한 것이 있다고 독자를 현혹하는 분장으로 보일 때가 더 많았다. 표현은 분장이 아니다. 분장인 것들을 지워 나가서, 더는 지워지지 않는 얼굴에 도달하는 작업이다. 문장을 써 나가는 일이 무언가를 지워 나가는 일이 되는 역전이 시에는 있다.\n\n25번 응모자의 「연남동 서정시」는 (특히 사랑에 대한) 앎과 모름 사이의 어떤 미묘한 경계, 혹은 그 경계를 감지하는 순간의 감정을, 연인들의 공간인 연남동의 풍경 속에서 탐문한다. 같은 응모자의 「철학 수업」에도 미묘한 경계가 있다. 인생은 살아가는 것인가 죽어가는 것인가, 살아가는 것이라고 답하는 것은 살고 싶다고 답하는 것과 같은가 다른가.\n\n91번 응모자의 「뾰족한 곳」이나 「이름」은 문법적으로 성립되지 않는 문장들로, 따라잡기 쉽지 않은 기묘한 발상을 밀고 나가는데, 기이하게도 그 속에서 자신의 어떤 생각을 명료하게 만들어 나가려는 자의 열기를 느낄 수 있는 경우다. 그러므로 이 제멋대로인 상상력은 단정하게 다듬어지지 않아야 되겠다.\n\n73번 응모자의 「명랑」과 「잠수」에는 명료한, 명료해진 감정이 있다. 그것은 자기 인식을 위한 노력 덕분에 명료해진 감정일 것이다. 모르는 사람의 납골당 앞에서 울다 돌아오는 사람의 모습, 욕조 속에서 숨을 끝까지 참으면 죽을 수 있을까를 생각하는 사람의 모습이, 그 감정을, 어떤 겸손한 진실함 속에서 전달해낸다.\n\n당선작이 된 48번 응모자의 「아기 엄마」는 자신에게 주어질 미래의 가능성에 대한 불안과 의욕을 임신과 출산의 비유를 통해 말하고 있는 것으로 읽히는데, 이런 분석 이전에 이미 읽는 이를 사로잡는 강렬함이 있다. 표현하고 있는 문장들이 표현되고 있는 감정과 빈틈없이 밀착돼 있다는 느낌이다. 심사위원 만장일치였다. 당선을 축하한다.",

      "body": "1\n\n추상을 보고 싶어 유리잔을 엎었다\n하얀 면 티셔츠에 희미한 얼룩이 졌다\n\n대리석은 죽은 생물들의 표정을 머금고 있는 것 같아\n물방울이 한 방울 바닥 위로 떨어지면\n한 생물의 표정이 기묘하게 확대되지\n\n표정이 증발한 기체처럼 기분은\n날씨에 따라 나를 축축하게 만들기도 하고\n어떤 때는 한없이 물기를 쥐어짜기도 한다\n\n시간이 지나면 거두어지는 것들이 모여 비를 내리고\n\n네가 새 티셔츠에 목을 넣을 때 생각한다*\n우리는 잠시 서로에게 가려진 얼룩이라는 것을\n\n부엌에 냉동고가 고장 났을 동안\n각얼음이 짓는 표정들은 투명한 소리를 내며 녹아내렸고\n\n마침내 고내등이 내부를 밝혔을 때\n틀 안엔 뭉크러진 울음들이 있었다\n가면을 씌우기에도 지지력 없는 바탕이었다\n\n2\n\n추상을 보고 싶어 네 얼굴을 들여다보았다\n물때 같은 웃음들이 내 얼굴에 옮겨와 번졌다\n\n젖은 티셔츠가 보송하게 마르고\n장마전선이 서서히 북상해 네 이마 위를 지나쳐 갔다\n\n창밖으로 올려다본 하늘엔 구름이 몇 점 없었다, 그마저\n모두가 발 빠르게 움직이고 있었고\n\n구겨진 하늘을 펴느라 분주한 것처럼 보였다\n몇 안 남은 미소를 마저 내리고 가려는 듯이\n\n부엌에서는\n냉매가 상쾌한 소리를 내며 냉장고를 식히고 있었다\n\n정오가 되었고\n햇빛이 거실로 들어와 습기 찬 바닥을 말린다\n\n대리석 바닥 위 죽은 표정이 말끔히 증발한다\n우린 서로에게 더 이상 분명해지지 않기로 했다\n\n─\n* 유희경 「티셔츠에 목을 넣을 때 생각한다」",

      "title": "수상소감",
      "body": " 감사합니다. 낳으시고 길러주셨습니다. 부모님, 외할머니 감사합니다. 아무 이유도 없습니다. 야미 스터디 공주, 썸머킹, 어린 상자 감사합니다. 선생님이 많았습니다. 선생님 감사합니다. 친구들도 있습니다. 문창과 친구들 감사합니다. 경남청년문학상이 열렸습니다. 이달균 회장님을 비롯한 경남문인협회 감사합니다. 시를 애써 심사해주신 분들이 계십니다. 이월춘 시인님, 김우태 시인님 감사합니다. 남은 날들 함께 고생합시다. CGV 미소지기들 감사합니다. 감사합니다.\n\n앞으로는 감사할 사람이 더 많아졌으면 좋겠습니다.",

      "kind": "poem",
      "title": "키친 드링커",
      "body": "─ 앉아요\n\n─ 네\n\n─ 슬픈가요?\n\n─ 네\n\n─ 해가 떠도요?\n\n─ 네\n\n창밖으로 산이 보인다\n\n내 부엌에는 따로 창문을 두지 않았다\n\n조용히 숨 참으면\n\n말을 걸어볼 수 있는\n\n낮달,\n\n낮달의 뺨이 내 뺨보다도 흰데\n\n앉으면 절로 다리를 떨게 되는 식탁에서\n\n오늘은\n\n떨어진 먼지들을 주워 다발로 묶을 예정이고\n\n어쩐지, 자꾸만 팽창하는 부엌의 벽\n\n나는 낮달을 끌어안은 채\n\n어디가 슬프냐고, 그러면\n\n그는 꼭꼭 묶은 낮 새들을 유리병에 꽂아\n\n나에게로 건넨다\n\n─ 뒷면이요\n\n움푹 파인 너의 정면과 나의 정면이 부딪히는 속도로\n\n선반 위 향신료 병에 가닿는 눈빛\n\n그 순간 나는 한 마리의 은빛 멸치\n\n고개가 삐뚤어진 채 헤엄치는 시간은 버거울까?\n\n채반에서 물이 빠지듯\n\n천천히, 천천히 눈동자를 굴려\n\n창문을 연다\n\n한 번도 쓸린 적 없는 창틀에는\n\n벌레들이 알을 슬어놓았고\n\n나는 토치를 켜고 그 알들을 전부 태운다\n\n내 뺨이 낮달의 뺨보다 더욱 붉어질 때까지,\n\n낮달에게 묻는다\n\n─ 행복한가요?\n\n창밖으로 해가 진다\n\n부엌에는 따로 창문을 두지 않는데도 알 수가 있다\n\n하얀 리넨 벽지가 한 뼘 거리까지 오면\n\n보이지 않는 낮달,\n\n새들의 울음소리가 들리지 않는다\n\n조용히 있어도 말을 걸어볼 이가\n\n없다,\n\n혼자서 달달달 다리를 떨고\n\n가스 불을 줄여서 끄고\n\n나는 잠 깬 적 없는 한 사람의 여자로 남길 바라면서\n\n쇠젓가락을 떨어뜨린다",

    {
      "id": "document-2",
      "kind": "speech",
      "title": "수상소감",
      "body": "<수상 소감>\n\n \n\n \n\n[원문 특수문자 U+F04A] 원호는 미신이나 운명 혹은 그런 종류의 근거 없는 믿음을 갖는 편은 아니지만 어렸을 때부터 R=VD(생생하게 꿈꾸면 이루어진다는 공식)만은 믿어보기로 했던 것 같다. 초등학생 때는 같이 앉을 짝의 모습을 그려보기도 했다(자리 배정 제비뽑기 시간에 그 친구는 결국 원호 옆자리에 왔다). 전주책방문학상에 시를 투고하기 전부터, 투고할 시를 쓰는 동안에도 원호는 초지일관 물결서사만을 그렸다. 어떻게 생겼는지도 모르는데 어떻게 그릴 수 있었을까? 그래서 얼마 전에는 물결서사에 다녀왔다고 한다. 책을 샀고, 귀여운 길고양이가 있는 골목도 걸었다. 골목 안에는 또 다른 작은 골목이 있었는데, 들어가 보니 폐가였다, 풀이 많이 자라있었다. 빈 가스통이 방치되어있고 길바닥에는 개똥도 있었다. 하얗게 굳어있었다,라는, 이런 세세한 풍경들을 눈에 익혀 두었다가 집에 와 틈틈이 떠올리면서 원호는 시를 썼다(비밀인데 원호는 짝이 될 그 친구와 친해지고 싶었다). 투고 메일을 보낼 때였는데... 그때 원호는 사실 아주아주... 물결서사와 친해지고 싶었습니다(그런 염원!). 다행히 이제 조금은 친해진 것도 같다(비밀은 아닌데 물결서사의 책방지기, 임주아 시인님의 라이브방송을 종종 보기도 했다! 이것도 R=VD일까). 지금 원호는 좋아하는 친구와 짝이 되어서 방긋, 웃고 있는 중이라고 한다. [원문 특수문자 U+F04A]➜●(수줍은 원호가 뒤로 빙글 돌아섰다). 원호는 뒷머리가 길구나. 원호는 시인이 될 때까지 머리카락을 절대 자르지 않겠다고 했어요. 내년일까? 조만간일까? 나는 원호와 맛있는 밥을 먹으러 가야겠다. ≋!\n\n​\n\n​",

      "id": "document-1",
      "kind": "poem",
      "title": "슬리퍼는 슬피 울어",
      "body": "비 오는 날에는 발도 젖기를 원한다. 발가락 사이사이를 활짝 열고 물을 마시길 원한다. 산성비라도 괜찮으면 실컷 마시라고, 나는 앞뒤가 뚫린 슬리퍼를 신고 나간다. 아무리 성실하고 정확한 인부라도 완벽한 평면으로 아스팔트를 깔 수 없다. 지구는 둥글기에 어디 하나 웅덩이쯤은 생기기 마련이다. 슬리퍼는 사막에서 오아시스를 발견한 낙타처럼 허겁지겁 달려가 코를 박고 물을 마신다. 흠뻑 얼굴을 적시고 나면 한층 상쾌해진 걸음으로 갈 길을 간다. 몸을 앞뒤로 흔들며 얼굴에 묻은 물기도 털어본다. 골목을 돌아 카센터 앞을 지나면 무지개가 뜬 웅덩이를 볼 수도 있다. 그 밑을 파보면 필시 석유가 터져 나올 것이다. 이미 흠뻑 젖은 슬리퍼는 코를 길게 뻗어 무지개를 휘휘 저어본다. 무지개가 웅덩이 둘레를 따라 빙글빙글 돌다가 엄지와 검지 사이로 미끈하게 파고든다. 우산 높이까지 기름 냄새가 올라온다. 일곱 개의 색 중에 어떤 색이 이토록 고약한 냄새를 가지고 있는 것인지, 따로 떼어낼 수 있다면 좋겠지만, 끈끈한 촉감만큼이나 끈끈한 우정을 가진 일곱 친구는 떨어질 수 없는 관계이다. 다시, 슬리퍼는 무지개가 없는 웅덩이가 나올 때까지 걷고 또 걷는다. 아름다운 색채에 속는 일은 다시는 없으리라고 다짐을 안은 채 한없이 걷는다. 발가락 틈새에 얇은 무지개 조각을 끼우고서, 한없이, 한없이.",

  if(!s) return "";

}

function bodyHtml(w){
  if(w.rich && window.PortfolioText){
    try { return `<div class="w-body rich-body">${PortfolioText.renderRich(w.rich)}</div>`; } catch {}
  }
  if(w.section === "poem")
    return `<div class="w-body poem">${esc(w.body)}</div>`;
  const ps = w.body.split(/\n{2,}/)
    .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
  return `<div class="w-body prose">${ps}</div>`;
}

function renderWork(w){
  const list = WORKS.filter(x => x.section === w.section);
  const i = list.findIndex(x => x.id === w.id);
  const prev = list[i + 1], next = list[i - 1];
  const icon = name => `<svg aria-hidden="true" viewBox="0 0 24 24"><use href="assets/editor/icons.svg#${name}"></use></svg>`;
  const signature = window.readerView?.textSignature(w.body + JSON.stringify(w.rich || null)) || "";
  const resume = window.readerView?.isLongReading(w.section, w.body.length) || false;
  return `<article class="reader reader--${w.section === "poem" ? "poem" : "essay"}" data-work-id="${esc(w.id)}" data-signature="${signature}" data-resume="${resume}">
    ${readingTools(w.section)}

    <h1 class="w-title">${esc(w.title)}</h1>
    <p class="w-meta">${fmtDate(w.date)}${w.meta ? " · " + esc(w.meta) : ""}</p>
    ${bodyHtml(w)}
    ${w.link ? `<a class="wlink" href="${esc(w.link)}" target="_blank" rel="noopener">원문 보기 →</a>` : ""}
    ${w.note ? `<p class="w-note">${esc(w.note)}</p>` : ""}
    <nav class="pn">
      <span>${prev ? `<a href="#/w/${esc(prev.id)}">← ${esc(prev.title)}</a>` : ""}</span>

      <span style="text-align:right">${next ? `<a href="#/w/${esc(next.id)}">${esc(next.title)} →</a>` : ""}</span>
    </nav>
    ${readingResume()}
  </article>`;
}

function renderActivity(entry, documentId){

function gbSubmit(e){
  e.preventDefault();
  const f = e.target;
  const name = f.elements["name"].value.trim();
  const msg  = f.elements["message"].value.trim();
  const st = document.getElementById("gb-status");
  if(!msg){ st.textContent = "내용을 적어 주세요."; return; }
  if(SITE.guestbookEndpoint){
    st.textContent = "보내는 중…";
    fetch(SITE.guestbookEndpoint, {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ 이름: name || "익명", 내용: msg })
    }).then(r => {
      st.textContent = r.ok
        ? "잘 도착했습니다. 남겨 주셔서 고맙습니다."
        : "전송하지 못했습니다. 잠시 후 다시 시도해 주세요.";
      if(r.ok) f.reset();
    }).catch(() => {
      st.textContent = "전송하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });
  } else {
    location.href = "mailto:" + SITE.email
      + "?subject=" + encodeURIComponent("[방문록] " + (name || "익명"))
      + "&body=" + encodeURIComponent(msg);
    st.textContent = "메일 창이 열렸습니다. 그대로 보내 주시면 됩니다.";
  }
}

const app = document.getElementById("app");

function markNav(key){
  document.querySelectorAll("nav.top a").forEach(a =>
    a.classList.toggle("on", a.dataset.n === key));
}

function route(){
  window.readerView?.unmount();
  const seg = location.hash.replace(/^#\/?/, "").split("/");
  let html, ttl = SITE.title, nav = "", home = false;
  if(seg[0] === "w" && seg[1]){
    const w = WORKS.find(x => x.id === decodeURIComponent(seg[1]));
    if(w){ html = renderWork(w); ttl = `${w.title} — ${SITE.title}`; nav = w.section; }
    else { html = renderHome(); home = true; }
  } else if(SEC[seg[0]]){
    html = renderList(seg[0]); ttl = `${SEC[seg[0]].label} — ${SITE.title}`; nav = seg[0];
  } else if(seg[0] === "about"){
    const entry = seg[1] && PortfolioActivities.activityEntries(ABOUT).find(it => it.id === seg[1]);
    html = entry ? renderActivity(entry, seg[2]) : renderAbout();
    ttl = `${entry ? entry.t : "소개"} — ${SITE.title}`; nav = "about";
  } else if(seg[0] === "guest"){
    html = renderGuest(); ttl = `방문록 — ${SITE.title}`; nav = "guest";
  } else {
    html = renderHome();
    home = true;
  }
  app.innerHTML = html;
  document.title = ttl;
  markNav(nav);
  document.body.classList.toggle("is-home", home);
  paintVisitorCounter();
  window.scrollTo(0, 0);
  const gf = document.getElementById("gbf");
  if(gf) gf.addEventListener("submit", gbSubmit);
  /* 좁은 화면에서 들판이 옆으로 길면, 처음에 인물이 보이도록 */
  const sc = document.getElementById("scene");
  if(sc && sc.scrollWidth > sc.clientWidth){
    sc.scrollLeft = sc.scrollWidth * 0.635 - sc.clientWidth / 2;
  }
  window.homeMotion?.mount(sc);
  window.readerView?.mount();
}

window.addEventListener("hashchange", route);
route();

  if(!m) return;
  let seen = false;
  try{
    seen = sessionStorage.getItem("mist") === "1";

function paintVisitorCounter(){

  if(!el || !c) return;
  el.textContent = c.total + "/" + c.daily;
}

(function(){
  const ns = SITE.visitorCounterNamespace;
  if(!ns) return;
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
  const today = parts.year + "-" + parts.month + "-" + parts.day;
  const storageKey = "kimwonho-visit-" + today;
  let alreadyCounted = false;
  try{
    alreadyCounted = localStorage.getItem(storageKey) === "1";
    if(!alreadyCounted) localStorage.setItem(storageKey, "1");
  }catch(e){}

  const base = "https://api.counterapi.dev/v1/" + encodeURIComponent(ns) + "/";
  const action = alreadyCounted ? "/" : "/up";
  const get = name => fetch(base + encodeURIComponent(name) + action, {
    cache: "no-store", credentials: "omit"
  }).then(r => {
    if(!r.ok) throw new Error("counter");
    return r.json();
  });
  Promise.all([
    get("total"),
    get("daily-" + today)
  ]).then(([a, b]) => {
    window.__visitorCounts = {
      total: Number(a.count) || 0,
      daily: Number(b.count) || 0
    };
    paintVisitorCounter();
  }).catch(() => {});
})();
</script>
